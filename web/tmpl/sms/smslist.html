<div id="innerContainer">
    <div class="row header-row">
        <div class="col-xs-1">
            <a href="#home">
                <img alt="" src="img/arrow-back.png">
            </a>
        </div>
        <div class="col-xs-11">
            <div class="form-title">
                <h1 data-trans="smsfwd_title"></h1>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-2">
            <div class="nav_right">
                <ul>
                    <li class="active"><a href="#sms" data-trans="smsfwd_records"></a></li>
                    <li><a href="#sms_setting" data-trans="smsfwd_setting"></a></li>
                </ul>
            </div>
        </div>
        <div class="col-xs-10">
            <div class="form-body">
                <div class="content">
                    <h3 class="form-title" data-trans="smsfwd_state"></h3>
                    <div class="row form-group">
                        <label class="col-xs-3 side-right" data-trans="smsfwd_state"></label>
                        <div class="col-xs-8">
                            <span id="smsfwdState" class="label label-default">-</span>
                            <span id="smsfwdPid" class="text-muted"></span>
                            <span id="smsfwdApiErr" class="error" style="display: none; margin-left: 8px;" data-trans="smsfwd_api_off"></span>
                        </div>
                    </div>
                    <div class="row form-group">
                        <label class="col-xs-3 side-right" data-trans="smsfwd_interval"></label>
                        <div class="col-xs-8">
                            <span id="smsfwdInterval">-</span> <span data-trans="smsfwd_seconds"></span>
                        </div>
                    </div>
                    <div class="row form-group">
                        <label class="col-xs-3 side-right" data-trans="smsfwd_forwarded"></label>
                        <div class="col-xs-8">
                            <span id="smsfwdForwarded">0</span>
                            <span class="text-muted"> / </span>
                            <span data-trans="smsfwd_failed"></span>
                            <span id="smsfwdFailed">0</span>
                        </div>
                    </div>
                    <div class="row form-group">
                        <label class="col-xs-3 side-right" data-trans="smsfwd_webhook_label"></label>
                        <div class="col-xs-8">
                            <span id="smsfwdWebhook" class="text-muted" style="word-break: break-all;">-</span>
                        </div>
                    </div>
                    <div class="row form-group">
                        <label class="col-xs-3 side-right" data-trans="smsfwd_last"></label>
                        <div class="col-xs-8">
                            <span id="smsfwdLast" class="text-muted" style="word-break: break-all;">-</span>
                        </div>
                    </div>
                </div>

                <div class="content">
                    <h3 class="form-title" data-trans="smsfwd_records"></h3>
                    <table class="table table-striped table-condensed" id="smsfwdLogTable">
                        <thead>
                        <tr>
                            <th style="width: 22%;" data-trans="smsfwd_time"></th>
                            <th data-trans="smsfwd_content"></th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <div id="smsfwdLogEmpty" class="text-muted" style="display: none;" data-trans="smsfwd_nolog"></div>
                </div>

                <div class="form-buttons">
                    <input type="button" id="smsfwdOnce" class="btn btn-primary" data-trans="smsfwd_now"/>
                    <input type="button" id="smsfwdTest" class="btn" data-trans="smsfwd_test"/>
                    <input type="button" id="smsfwdStart" class="btn" data-trans="smsfwd_start"/>
                    <input type="button" id="smsfwdStop" class="btn" data-trans="smsfwd_stop"/>
                    <input type="button" id="smsfwdRefresh" class="btn" data-trans="smsfwd_refresh"/>
                </div>

                <div class="form-note">
                    <div class="notes-title">&nbsp;</div>
                    <ul class="notes-content">
                        <li data-trans="smsfwd_note_1"></li>
                        <li data-trans="smsfwd_note_2"></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
